name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"  # same as Raspberry Pi OS Bookworm
      - run: pip install pytest
      - run: python -m pytest -q pi/tests pc-helper/tests
      - run: for f in pi/setup/*.sh pi/setup/desk-check; do bash -n "$f" || exit 1; done
