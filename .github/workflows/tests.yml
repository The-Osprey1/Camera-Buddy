name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"  # same as Raspberry Pi OS Bookworm
      - run: pip install pytest numpy  # numpy comes with Raspberry Pi OS (python3-numpy)
      - run: python -m pytest -q pi/tests pc-helper/tests
      - run: for f in pi/setup/*.sh pi/setup/desk-check pi/setup/desk-face; do bash -n "$f" || exit 1; done

  pc-helper-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest pyserial
      - run: python -m pytest -q pc-helper/tests
