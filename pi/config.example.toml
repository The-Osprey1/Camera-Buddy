# Desk presence settings. Copy to ~/desk-presence/config.toml and change what you like.
# Anything left out uses the default shown here.

# Practice mode writes down what it would do and presses no keys.
# Leave it on for the first week, read the log (`python3 -m desk_presence log`),
# adjust the timings below, then set it to false.
practice_mode = true

event_log = "~/desk-presence/events.jsonl"

# How long the pause switch (Ctrl+Alt+P on the PC, or the optional button) pauses for.
pause_seconds = 3600

# Raspberry Pi pin (BCM numbering) for an optional pause button wired to ground. 0 = no button.
pause_button_pin = 0

[display]
# Optional 128x64 SSD1306 OLED. Automatically connects when attached; missing
# hardware never stops the camera. Set false to disable (also frees BCM 2/3).
enabled = true
i2c_bus = 1
address = 0x3c # Some modules use 0x3d instead.
rotate = 0 # Set 180 if mounted upside down beneath the camera.

[presence]
# Your body must be out of view this long before the PC locks.
away_seconds = 5.0
# A body must be seen this long to count as "back".
return_confirm_seconds = 0.5
# How sure the model must be of a body point (0 to 1).
min_keypoint_score = 0.3
# Head and shoulder points needed for a body to count.
min_upper_body_points = 3
# Shoulders this far above your seated height (share of picture height) = stood up.
stand_rise = 0.15
# Below this brightness it does nothing at all. 0 turns the check off.
min_lux = 5.0

[second_person]
# "warn" (tell the PC helper), "lock" (also lock) or "off".
action = "warn"
# How big they must be compared with you, so people far behind you don't count.
min_size_ratio = 0.25
seconds = 2.0
cooldown_seconds = 60.0

[unlock]
# Face unlock. "practice" (the default) writes down when it would have unlocked, and
# types nothing. "on" types your Windows PIN when it recognizes you, once practice_mode
# above is false too. "off" never looks for faces. Nothing happens until you've
# enrolled your face with desk-face.
mode = "practice"
# How alike a face must be to yours (0 to 1). Higher is stricter.
match_threshold = 0.45
# Your face must match on this many looks in a row, over at least this many seconds.
match_frames = 5
match_seconds = 0.8
# It stops looking this long after you sit down, until you next leave and come back.
give_up_seconds = 30.0
# It only unlocks if it locked the PC itself, at most this many hours ago.
max_hours = 4.0
# The fake-face check: a face scoring below this counts as a photo or a screen.
# Raise it (say to 1.0) if desk-face photo-test fools it; lower it if it refuses you.
real_face_threshold = 0.0
# A matching face that looks fake this many times turns auto-unlock off until you unlock by hand.
fake_frames = 3
